[project]
name = "usd-avatar-runtime"
# Mirrors the repository-root VERSION file.
version = "0.4.0"

[requires]
platform = "cy2026"
profile = "usd"

# The dependency-free core and the two sessions are release members. The other
# optional adapters are source-built against installed owners; see
# docs/releases/README.md.
[workspace]
members = [
  "libs/avatarRuntime",
  "libs/avatarVrmSession",
  "libs/avatarMmdSession",
]
release_members = [
  "avatarRuntime",
  "avatarVrmSession",
  "avatarMmdSession",
]
