# OpenStrata plain-library descriptor. The core and the native MMD session's
# adapters, in one prefix. It provides the same AvatarRuntime CMake package as
# avatarRuntime, so a consumer pins one package; see
# docs/architecture/PROJECT_LAYOUT.md#packaging.
#
# No package_contract: `ost library verify-consumer` resolves only a declared closure,
# and physicsJoltSixDof requires a Jolt SDK the consumer builds, which no package provides.
# scripts/check_session_consumer.py --session mmd builds and runs the installed consumer instead.
